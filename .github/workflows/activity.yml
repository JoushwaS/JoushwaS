name: Update Activity Assets

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "README.md"
      - ".github/workflows/activity.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Activity graph + stats are served via public APIs in README.md.
      # This workflow keeps a lightweight stamp so Actions history shows health.
      - name: Write activity stamp
        run: |
          mkdir -p assets/animations
          date -u +"Last activity workflow run: %Y-%m-%dT%H:%M:%SZ" > assets/animations/activity-stamp.txt

      - name: Commit stamp
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh activity stamp"
          file_pattern: assets/animations/activity-stamp.txt
