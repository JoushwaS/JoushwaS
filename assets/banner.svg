<!-- ===================================================== -->
<!-- STYLES -->
<!-- ===================================================== -->

<style>

.name{
    font-family:Inter,"Segoe UI",Arial,sans-serif;
    font-size:52px;
    font-weight:800;
    fill:#F8FAFC;
    letter-spacing:-1px;
}

.role{
    font-family:Inter,"Segoe UI",Arial,sans-serif;
    font-size:24px;
    font-weight:600;
    fill:#E2E8F0;
}

.meta{
    font-family:Inter,"Segoe UI",Arial,sans-serif;
    font-size:17px;
    font-weight:500;
    fill:#94A3B8;
}

.caption{
    font-family:Inter,"Segoe UI",Arial,sans-serif;
    font-size:13px;
    fill:#64748B;
}

</style>

<!-- ===================================================== -->
<!-- LEFT CONTENT -->
<!-- ===================================================== -->

<g id="content">

<text
class="name"
x="90"
y="110">

JOUSHWA SHAHZAD

</text>

<rect
x="92"
y="128"
width="230"
height="5"
rx="3"
fill="url(#accent)"/>

<text
class="role"
x="90"
y="182">

Senior Software Engineer

</text>

<text
class="meta"
x="90"
y="225">

AI Engineer

</text>

<circle cx="215" cy="219" r="2" fill="#64748B"/>

<text
class="meta"
x="230"
y="225">

Full Stack Architect

</text>

<circle cx="432" cy="219" r="2" fill="#64748B"/>

<text
class="meta"
x="448"
y="225">

Cloud Engineer

</text>

<text
class="caption"
x="90"
y="285">

Building scalable products, distributed systems,

</text>

<text
class="caption"
x="90"
y="307">

AI-powered applications and cloud-native platforms.

</text>

</g>

<!-- ===================================================== -->
<!-- PORTRAIT -->
<!-- ===================================================== -->

<defs>

<linearGradient
id="portraitFade"
x1="0%"
y1="0%"
x2="100%"
y2="0%">

<stop offset="0%" stop-color="white" stop-opacity="0"/>

<stop offset="18%" stop-color="white"/>

<stop offset="100%" stop-color="white"/>

</linearGradient>

<mask id="portraitMask">

<rect
width="1500"
height="500"
fill="url(#portraitFade)"/>

</mask>

</defs>

<g mask="url(#portraitMask)">

<image
href="profile-photo.png"
x="980"
y="35"
width="430"
height="430"
preserveAspectRatio="xMidYMid meet"/>

</g>

<!-- ===================================================== -->
<!-- SUBTLE VIGNETTE -->
<!-- ===================================================== -->

<defs>

<radialGradient
id="vignette"
cx="50%"
cy="50%"
r="80%">

<stop offset="65%"
stop-color="transparent"/>

<stop offset="100%"
stop-color="#000814"
stop-opacity=".30"/>

</radialGradient>

</defs>

<rect
width="1500"
height="500"
fill="url(#vignette)"/>

<!-- ===================================================== -->
<!-- AMBIENT GLOW -->
<!-- ===================================================== -->

<circle
cx="1180"
cy="250"
r="180"
fill="#3B82F6"
opacity=".06">

<animate
attributeName="opacity"
values=".04;.09;.04"
dur="8s"
repeatCount="indefinite"/>

</circle>

<!-- ===================================================== -->
<!-- VERSION -->
<!-- ===================================================== -->

<text
x="1425"
y="480"
text-anchor="end"
font-family="Inter"
font-size="10"
fill="#475569">

v1.0

</text>