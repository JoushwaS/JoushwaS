<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Joushwa Shahzad  Senior Software Engineer</title>
  <desc id="desc">Premium dark hero banner with animated gradient, particles, and tech marks</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A">
        <animate attributeName="stop-color" values="#0F172A;#0B1224;#0F172A" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A">
        <animate attributeName="stop-color" values="#0F172A;#132033;#0F172A" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#10B981"/>
      <animate attributeName="x1" values="0%;40%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;60%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <!-- Grid -->
  <g opacity="0.12" stroke="#64748B" stroke-width="1">
    <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200 M0 280 H1200 M0 350 H1200"/>
    <path d="M100 0 V420 M200 0 V420 M300 0 V420 M400 0 V420 M500 0 V420 M600 0 V420 M700 0 V420 M800 0 V420 M900 0 V420 M1000 0 V420 M1100 0 V420"/>
  </g>

  <!-- Orbit rings -->
  <g fill="none" stroke="#3B82F6" stroke-opacity="0.25">
    <ellipse cx="920" cy="180" rx="160" ry="90">
      <animateTransform attributeName="transform" type="rotate" from="0 920 180" to="360 920 180" dur="28s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="920" cy="180" rx="120" ry="160" stroke="#10B981" stroke-opacity="0.2">
      <animateTransform attributeName="transform" type="rotate" from="360 920 180" to="0 920 180" dur="22s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Particles -->
  <g fill="#93C5FD">
    <circle cx="180" cy="80" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="320" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="70" r="2"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="300" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="360" r="2"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="340" r="2"><animate attributeName="cy" values="340;320;340" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Accent bar -->
  <rect x="64" y="118" width="72" height="4" rx="2" fill="url(#accent)"/>

  <!-- Name + title -->
  <text x="64" y="180" fill="#F8FAFC" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="700">Joushwa Shahzad</text>
  <text x="64" y="228" fill="#93C5FD" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500">Senior Software Engineer</text>
  <text x="64" y="268" fill="#94A3B8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16">AI Engineer  ·  Full Stack Architect  ·  Cloud Engineer  ·  System Designer</text>

  <!-- Tech pills -->
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#E2E8F0">
    <g>
      <rect x="64" y="308" width="78" height="32" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="103" y="328" text-anchor="middle">Node.js</text>
    </g>
    <g>
      <rect x="154" y="308" width="72" height="32" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="190" y="328" text-anchor="middle">React</text>
    </g>
    <g>
      <rect x="238" y="308" width="108" height="32" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="292" y="328" text-anchor="middle">PostgreSQL</text>
    </g>
    <g>
      <rect x="358" y="308" width="60" height="32" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="388" y="328" text-anchor="middle">AWS</text>
    </g>
    <g>
      <rect x="430" y="308" width="78" height="32" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="469" y="328" text-anchor="middle">Docker</text>
    </g>
  </g>

  <!-- Right visual: abstract system node -->
  <g transform="translate(780,90)">
    <rect x="40" y="40" width="220" height="140" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2" opacity="0.95"/>
    <rect x="60" y="68" width="80" height="18" rx="4" fill="#3B82F6" opacity="0.9">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="100" width="140" height="10" rx="3" fill="#334155"/>
    <rect x="60" y="120" width="110" height="10" rx="3" fill="#334155"/>
    <rect x="60" y="140" width="150" height="10" rx="3" fill="#334155"/>
    <circle cx="230" cy="40" r="10" fill="#10B981">
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- floating nodes -->
    <circle cx="20" cy="30" r="6" fill="#3B82F6" opacity="0.8">
      <animate attributeName="cy" values="30;50;30" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="160" r="5" fill="#60A5FA" opacity="0.7">
      <animate attributeName="cx" values="280;260;280" dur="4s" repeatCount="indefinite"/>
    </circle>
    <path d="M20 30 C 40 80, 80 20, 100 70" fill="none" stroke="#3B82F6" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" values="0;40" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect x="0" y="416" width="1200" height="4" fill="url(#accent)"/>
</svg>
