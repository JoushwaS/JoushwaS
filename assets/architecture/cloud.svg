<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img">
  <title>Cloud Architecture</title>
  <rect width="1000" height="220" rx="12" fill="#0F172A" stroke="#1E293B"/>
  <text x="24" y="36" fill="#F8FAFC" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700">Cloud Architecture</text>
  <text x="24" y="58" fill="#64748B" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12">CloudFront ’ Next.js ’ NestJS ’ Redis ’ PostgreSQL ’ AWS S3</text>
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3B82F6"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#E2E8F0">
    <rect x="16" y="100" width="120" height="56" rx="10" fill="#1E293B" stroke="#3B82F6"/>
    <text x="76" y="134" text-anchor="middle">CloudFront</text>
    <line x1="136" y1="128" x2="164" y2="128" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow2)"/>
    <rect x="168" y="100" width="100" height="56" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="218" y="134" text-anchor="middle">Next.js</text>
    <line x1="268" y1="128" x2="296" y2="128" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow2)"/>
    <rect x="300" y="100" width="100" height="56" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="350" y="134" text-anchor="middle">NestJS</text>
    <line x1="400" y1="128" x2="428" y2="128" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow2)"/>
    <rect x="432" y="100" width="100" height="56" rx="10" fill="#1E293B" stroke="#10B981"/>
    <text x="482" y="134" text-anchor="middle">Redis</text>
    <line x1="532" y1="128" x2="560" y2="128" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow2)"/>
    <rect x="564" y="100" width="130" height="56" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="629" y="134" text-anchor="middle">PostgreSQL</text>
    <line x1="694" y1="128" x2="722" y2="128" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow2)"/>
    <rect x="726" y="100" width="110" height="56" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="781" y="134" text-anchor="middle">AWS S3</text>
  </g>
  <text x="24" y="196" fill="#94A3B8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12">Edge delivery, API layer, cache, durable storage, object assets.</text>
</svg>
