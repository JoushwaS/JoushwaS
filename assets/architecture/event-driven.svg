<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img">
  <title>Event Driven Architecture</title>
  <rect width="1000" height="220" rx="12" fill="#0F172A" stroke="#1E293B"/>
  <text x="24" y="36" fill="#F8FAFC" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700">Event Driven Architecture</text>
  <text x="24" y="58" fill="#64748B" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12">Client ’ API ’ BullMQ ’ Redis ’ Workers ’ PostgreSQL</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3B82F6"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#E2E8F0">
    <rect x="24" y="100" width="110" height="56" rx="10" fill="#1E293B" stroke="#3B82F6"/>
    <text x="79" y="134" text-anchor="middle">Client</text>
    <line x1="134" y1="128" x2="168" y2="128" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="172" y="100" width="110" height="56" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="227" y="134" text-anchor="middle">API</text>
    <line x1="282" y1="128" x2="316" y2="128" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="320" y="100" width="110" height="56" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="375" y="134" text-anchor="middle">BullMQ</text>
    <line x1="430" y1="128" x2="464" y2="128" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="468" y="100" width="110" height="56" rx="10" fill="#1E293B" stroke="#10B981"/>
    <text x="523" y="134" text-anchor="middle">Redis</text>
    <line x1="578" y1="128" x2="612" y2="128" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="616" y="100" width="120" height="56" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="676" y="134" text-anchor="middle">Workers</text>
    <line x1="736" y1="128" x2="770" y2="128" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="774" y="100" width="140" height="56" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="844" y="134" text-anchor="middle">PostgreSQL</text>
  </g>
  <text x="24" y="196" fill="#94A3B8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12">Async jobs, retries, and backpressure for production workloads.</text>
</svg>
