<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="img" aria-labelledby="t d">
  <title id="t">Rotating professional titles</title>
  <desc id="d">Animated typing cycle of engineering titles</desc>
  <defs>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="72" rx="12" fill="#0F172A" stroke="#1E293B"/>
  <text x="40" y="44" fill="#64748B" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="500">I am a</text>

  <!-- Titles cycle: 9 roles × ~2.2s = ~19.8s loop -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">
    <text x="110" y="45" opacity="0">
      Senior Software Engineer
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.09;0.11;1" dur="19.8s" repeatCount="indefinite"/>
    </text>
    <text x="110" y="45" opacity="0">
      AI Engineer
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.11;0.13;0.20;0.22;1" dur="19.8s" repeatCount="indefinite"/>
    </text>
    <text x="110" y="45" opacity="0">
      System Architect
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.24;0.31;0.33;1" dur="19.8s" repeatCount="indefinite"/>
    </text>
    <text x="110" y="45" opacity="0">
      Full Stack Engineer
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.35;0.42;0.44;1" dur="19.8s" repeatCount="indefinite"/>
    </text>
    <text x="110" y="45" opacity="0">
      NestJS Expert
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.46;0.53;0.55;1" dur="19.8s" repeatCount="indefinite"/>
    </text>
    <text x="110" y="45" opacity="0">
      React Specialist
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.57;0.64;0.66;1" dur="19.8s" repeatCount="indefinite"/>
    </text>
    <text x="110" y="45" opacity="0">
      Cloud Engineer
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.68;0.75;0.77;1" dur="19.8s" repeatCount="indefinite"/>
    </text>
    <text x="110" y="45" opacity="0">
      Open Source Enthusiast
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.77;0.79;0.86;0.88;1" dur="19.8s" repeatCount="indefinite"/>
    </text>
    <text x="110" y="45" opacity="0">
      Problem Solver
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.88;0.90;0.97;0.99;1" dur="19.8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Cursor -->
  <rect x="520" y="24" width="3" height="26" fill="#3B82F6">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="x" values="430;280;320;340;260;300;280;400;290;430" dur="19.8s" repeatCount="indefinite"/>
  </rect>

  <rect x="0" y="0" width="6" height="72" rx="3" fill="url(#bar)"/>
</svg>
