<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img">
  <title>Technology Stack</title>
  <rect width="900" height="280" fill="#0F172A"/>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <!-- Languages -->
    <text x="16" y="28" fill="#3B82F6" font-size="13" font-weight="700" letter-spacing="1">LANGUAGES</text>
    <g font-size="13" fill="#E2E8F0">
      <rect x="16" y="40" width="100" height="30" rx="8" fill="#1E293B" stroke="#334155"/><text x="66" y="60" text-anchor="middle">TypeScript</text>
      <rect x="126" y="40" width="100" height="30" rx="8" fill="#1E293B" stroke="#334155"/><text x="176" y="60" text-anchor="middle">JavaScript</text>
    </g>
    <!-- Frontend -->
    <text x="16" y="98" fill="#3B82F6" font-size="13" font-weight="700" letter-spacing="1">FRONTEND</text>
    <g font-size="13" fill="#E2E8F0">
      <rect x="16" y="110" width="80" height="30" rx="8" fill="#1E293B" stroke="#334155"/><text x="56" y="130" text-anchor="middle">React</text>
      <rect x="106" y="110" width="80" height="30" rx="8" fill="#1E293B" stroke="#334155"/><text x="146" y="130" text-anchor="middle">Next.js</text>
      <rect x="196" y="110" width="110" height="30" rx="8" fill="#1E293B" stroke="#334155"/><text x="251" y="130" text-anchor="middle">React Native</text>
      <rect x="316" y="110" width="70" height="30" rx="8" fill="#1E293B" stroke="#334155"/><text x="351" y="130" text-anchor="middle">Redux</text>
      <rect x="396" y="110" width="80" height="30" rx="8" fill="#1E293B" stroke="#334155"/><text x="436" y="130" text-anchor="middle">Tailwind</text>
    </g>
    <!-- Backend -->
    <text x="16" y="168" fill="#3B82F6" font-size="13" font-weight="700" letter-spacing="1">BACKEND</text>
    <g font-size="13" fill="#E2E8F0">
      <rect x="16" y="180" width="80" height="30" rx="8" fill="#1E293B" stroke="#334155"/><text x="56" y="200" text-anchor="middle">Node.js</text>
      <rect x="106" y="180" width="80" height="30" rx="8" fill="#1E293B" stroke="#334155"/><text x="146" y="200" text-anchor="middle">NestJS</text>
      <rect x="196" y="180" width="80" height="30" rx="8" fill="#1E293B" stroke="#334155"/><text x="236" y="200" text-anchor="middle">Express</text>
      <rect x="286" y="180" width="80" height="30" rx="8" fill="#1E293B" stroke="#334155"/><text x="326" y="200" text-anchor="middle">GraphQL</text>
      <rect x="376" y="180" width="80" height="30" rx="8" fill="#1E293B" stroke="#334155"/><text x="416" y="200" text-anchor="middle">BullMQ</text>
      <rect x="466" y="180" width="90" height="30" rx="8" fill="#1E293B" stroke="#334155"/><text x="511" y="200" text-anchor="middle">Socket.IO</text>
    </g>
    <!-- Database -->
    <text x="16" y="238" fill="#3B82F6" font-size="13" font-weight="700" letter-spacing="1">DATABASE</text>
    <g font-size="13" fill="#E2E8F0">
      <rect x="16" y="250" width="100" height="30" rx="8" fill="#1E293B" stroke="#334155"/><text x="66" y="270" text-anchor="middle">PostgreSQL</text>
      <rect x="126" y="250" width="90" height="30" rx="8" fill="#1E293B" stroke="#334155"/><text x="171" y="270" text-anchor="middle">MongoDB</text>
      <rect x="226" y="250" width="70" height="30" rx="8" fill="#1E293B" stroke="#334155"/><text x="261" y="270" text-anchor="middle">Redis</text>
      <rect x="306" y="250" width="70" height="30" rx="8" fill="#1E293B" stroke="#334155"/><text x="341" y="270" text-anchor="middle">Prisma</text>
      <rect x="386" y="250" width="80" height="30" rx="8" fill="#1E293B" stroke="#334155"/><text x="426" y="270" text-anchor="middle">TypeORM</text>
    </g>
  </g>
</svg>
